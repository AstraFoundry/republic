name: Main

on:
  workflow_dispatch:
    inputs:
      number:
        description: Candidate PR number (zero for branch maintenance)
        type: string
        default: '0'
      head:
        description: Candidate head to review
        type: string
        default: ''
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: republic-ci-${{ github.repository_id }}-${{ github.event.pull_request.number || (inputs.number != '' && inputs.number != '0' && inputs.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (inputs.number != '' && inputs.number != '0') }}

jobs:
  go:
    name: Go (${{ matrix.os }}, ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          - os: ubuntu-latest
            go: '1.23.x'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l *.go examples/chat/*.go)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...

  go-parity:
    name: Go behavioral compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Check original-behavior baselines and protocol recordings
        run: make parity
      - name: Fuzz protocol parsers
        run: go test -run '^$' -fuzz '^FuzzStreamParser$' -fuzztime=10s
      - name: Fuzz message serialization
        run: go test -run '^$' -fuzz '^FuzzMessageJSON$' -fuzztime=10s

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: j178/prek-action@v1

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-docs
      - name: Build documentation
        run: make docs-test

  landing-feedback:
    name: Landing review
    needs: [go, go-parity, quality, check-docs]
    if: >-
      always() && !cancelled() && vars.LANDING_MODEL != '' &&
      ((github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.number != '' && inputs.number != '0'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.21"
          enable-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Review the candidate
        id: landing
        timeout-minutes: 20
        continue-on-error: true
        uses: bubbuild/landing@main
        env:
          GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
        with:
          trust: ${{ vars.LANDING_TRUST || 'repository' }}
          command: review
          number: ${{ format('{0}', github.event.pull_request.number || inputs.number || 0) }}
          head: ${{ github.event.pull_request.head.sha || inputs.head || '' }}
          checked-revision: ${{ github.sha }}
          instruction: >-
            Native checks: go=${{ needs.go.result }}, go-parity=${{ needs.go-parity.result }}, quality=${{ needs.quality.result }}, check-docs=${{ needs.check-docs.result }}.
            Ignore the Landing review job when assessing native check completion.
            Review affected user-visible behavior against repository guidance. Reuse these check results and relevant review history; investigate unresolved questions and publish useful findings or a brief clean verdict.
      - name: Report unsuccessful feedback
        if: ${{ !cancelled() && steps.landing.outcome == 'failure' }}
        run: echo "::warning::Landing feedback failed. Inspect the task artifact; native checks determine acceptance."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: landing-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
